name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Pinned to match the release build (see release.yml).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system libraries Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e . pytest
      - run: pytest
